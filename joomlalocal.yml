---
# on execution, overwrite project_name with
#
# ansible-playbook my_playbook.yml --extra-vars "project_name=my_project_name"
# 
# Project name is transformed across multiple tasks, 
# so you need to change this to your preference.
# Underscore as separator preferred.

# For now, this playbook relies on the web installer to
# bring everything together.
# Refer to the generated projectconfig.txt for db details

- name: Provision a local Joomla setup with composer
  hosts: localhost
  connection: local
  vars:
    project_name: joomladev
    license: MIT
    gitignore: php
    dev_user: ghost
    dev_group: ghost
    # suffix_db must be alphanumeric
    suffix_db: jmldb
    # suffix_user must be alphanumeric
    suffix_user: dev
    # download link to the preferred joomla installation
    joomla_zip: "https://downloads.joomla.org/cms/joomla5/5-1-1/Joomla_5-1-1-Stable-Full_Package.zip?format=zip"
  roles:
    - common
    - php
    - php-fpm
    - mariadb
    - joomla
    - apache
    - hosts
