- name: Add nvm path configurations
  when: modular_config == true
  become: false
  ansible.builtin.template:
    src: templates/path.j2
    dest: "{{ ansible_env.HOME }}/.config/shells/zsh/path/available/nvm.zsh"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: '0644'

- name: Expose nvm exec as available
  when: modular_config == true
  become: false
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.config/shells/zsh/path/available/nvm.zsh"
    dest: "{{ ansible_env.HOME }}/.config/shells/zsh/path/enabled/nvm.zsh"
    state: link

- name: Install NVM via git (no rc file mutation)
  ansible.builtin.git:
    repo: "https://github.com/nvm-sh/nvm.git"
    dest: "{{ ansible_env.HOME }}/.nvm"
    version: "v0.40.3"     
    update: yes            
    force: no              
    depth: 1               
    accept_hostkey: yes    

- name: Add nvm shell configurations
  when: modular_config == true
  become: false
  ansible.builtin.template:
    src: templates/config.j2
    dest: "{{ ansible_env.HOME }}/.config/shells/zsh/config/nvm.zsh"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: '0644'