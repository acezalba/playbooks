- name: Install NVM via git
  ansible.builtin.git:
    repo: "{{ nvm_git_url }}"
    dest: "{{ ansible_env.HOME }}/.nvm"
    version: "{{ nvm_version }}"
    update: yes            
    force: no              
    depth: 1               
    accept_hostkey: yes    

- name: Add nvm shell configurations
  when: modular_config == true
  become: false
  ansible.builtin.template:
    src: templates/config.j2
    dest: "{{ ansible_env.HOME }}/.config/shells/zsh/config/nvm.zsh"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: '0644'