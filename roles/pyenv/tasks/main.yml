- name: Update apt
  become: true
  become_method: sudo
  ansible.builtin.apt:
    update_cache: yes

- name: Install python build dependencies
  become: true
  become_method: sudo
  ansible.builtin.apt:
    pkg:
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - curl
      - git
      - libncursesw5-dev
      - xz-utils
      - tk-dev
      - libxml2-dev
      - libxmlsec1-dev
      - libffi-dev
      - liblzma-dev
    state: present